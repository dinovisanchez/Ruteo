# Corre las pruebas en cada push y en cada pull request
name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 es el Python que trae el Mac; 3.12 el de una instalación nueva
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      # uv trae cualquier Python, también el 3.9 que ya no viene en las máquinas de GitHub
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} .venv && uv pip install --python .venv -r requirements-dev.txt
        working-directory: backend
      - run: .venv/bin/python -m pytest
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx react-scripts test --watchAll=false
        working-directory: frontend
        env:
          CI: true
      # Con CI=true un aviso de compilación cuenta como error
      - run: npm run build
        working-directory: frontend
        env:
          CI: true

  navegador:
    name: Navegador (Metabase simulado)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
        env:
          CI: true
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: true
          PYTHON: python
      # Si algo falla: registros de los servidores, capturas y trazas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-navegador
          path: e2e/salida/
          retention-days: 7

  imagen:
    name: Imagen Docker (servidor)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ruteo .
      - name: Sin login (ni clave, ni Google, ni SIN_LOGIN=1) no arranca, ni con una clave corta
        run: |
          set +e
          salida=$(timeout 60 docker run --rm ruteo 2>&1); codigo=$?
          set -e
          echo "$salida"
          test "$codigo" -ne 0 && test "$codigo" -ne 124
          echo "$salida" | grep -F 'no arranca sin login' >/dev/null
          set +e
          salida=$(timeout 60 docker run --rm -e CLAVE_ACCESO=corta ruteo 2>&1); codigo=$?
          set -e
          echo "$salida"
          test "$codigo" -ne 0 && test "$codigo" -ne 124
          echo "$salida" | grep -F 'muy corta' >/dev/null
      - name: Con SIN_LOGIN=1, la imagen sirve la app y la API
        run: |
          docker run -d --name ruteo -p 8000:8000 -e SIN_LOGIN=1 ruteo
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/ | grep -F '<div id="root">' >/dev/null
          curl -sf localhost:8000/api/auth/config | grep -F '"google_client_id":null' >/dev/null
          curl -sf localhost:8000/api/catalogo >/dev/null
          docker rm -f ruteo
      - name: Con GOOGLE_CLIENT_ID, la API pide iniciar sesión y deja entrar a la app en Vercel
        run: |
          docker run -d --name ruteo -p 8000:8000 -e GOOGLE_CLIENT_ID=prueba.apps.googleusercontent.com \
            -e FRONTEND_URL=https://ruteo.vercel.app ruteo
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/catalogo)" = 401
          curl -sf localhost:8000/api/auth/config | grep -F 'prueba.apps.googleusercontent.com' >/dev/null
          curl -s -o /dev/null -D - -X OPTIONS localhost:8000/api/catalogo -H 'Origin: https://ruteo.vercel.app' \
            -H 'Access-Control-Request-Method: GET' | grep -Fi 'access-control-allow-origin: https://ruteo.vercel.app' >/dev/null
          docker rm -f ruteo
      - name: Con CLAVE_ACCESO, se entra con la clave y sin ella no
        run: |
          docker run -d --name ruteo -p 8000:8000 -e CLAVE_ACCESO=clave-de-prueba-larga ruteo
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/api/auth/config | grep -F '"modo":"clave"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/catalogo)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/auth/entrar \
            -H 'Content-Type: application/json' -d '{"clave":"otra-clave-cualquiera"}')" = 403
          token=$(curl -sf -X POST localhost:8000/api/auth/entrar -H 'Content-Type: application/json' \
            -d '{"clave":"clave-de-prueba-larga"}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          curl -sf localhost:8000/api/catalogo -H "Authorization: Bearer $token" >/dev/null
      - if: failure()
        run: docker logs ruteo || true
