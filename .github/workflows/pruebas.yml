# Corre las pruebas en cada push y en cada pull request
name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 es el Python que trae el Mac; 3.12 el de una instalación nueva
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      # uv trae cualquier Python, también el 3.9 que ya no viene en las máquinas de GitHub
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} .venv && uv pip install --python .venv -r requirements-dev.txt
        working-directory: backend
      - run: .venv/bin/python -m pytest
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx react-scripts test --watchAll=false
        working-directory: frontend
        env:
          CI: true
      # Con CI=true un aviso de compilación cuenta como error
      - run: npm run build
        working-directory: frontend
        env:
          CI: true

  navegador:
    name: Navegador (Metabase simulado)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
        env:
          CI: true
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: true
          PYTHON: python
      # Si algo falla: registros de los servidores, capturas y trazas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-navegador
          path: e2e/salida/
          retention-days: 7
